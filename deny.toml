# cargo-deny policy for fernjo (MIT OR Apache-2.0). See Docs/DECISIONS.md.

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; pulled in by Tauri's Linux GTK3 stack (glib-macros), no safe upgrade exists" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained; pulled in by zbus via tauri-plugin-single-instance (Linux D-Bus only), no safe upgrade exists" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained; pulled in by zbus via tauri-plugin-single-instance (Linux D-Bus only), no safe upgrade exists" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained; pulled in by zbus via tauri-plugin-single-instance (Linux D-Bus only), no safe upgrade exists" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
