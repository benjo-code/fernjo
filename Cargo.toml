[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/benjo-code/fernjo"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
directories = "6"
tempfile = "3"
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
secrecy = "0.10.3"
zeroize = "1.9.1"
unicode-normalization = "0.1.26"
getrandom = "0.4.3"
# `O_NOFOLLOW` and `O_NONBLOCK` for `fernjo-fs` on Unix (already in the tree through `getrandom`)
libc = "0.2.191"
fernjo-fs = { path = "crates/fernjo-fs" }
russh = { version = "0.65.1", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
roxmltree = "0.21.2"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
sha1 = "0.11.0"
base64 = "0.23.1"
hkdf = "0.13"
sha2 = "0.11.1"
# RDP (Milestone 8): the IronRDP crates come from one generation and are pinned exactly (every one
# of them pins its own `picky` release candidate, so mixing generations does not resolve).
ironrdp-core = "=0.3.1"
ironrdp-pdu = "=0.11.0"
ironrdp-connector = "=0.12.0"
ironrdp-session = "=0.13.0"
ironrdp-input = "=0.9.0"
ironrdp-graphics = "=0.11.0"
ironrdp-dvc = "=0.10.0"
ironrdp-displaycontrol = "=0.10.0"
ironrdp-cliprdr = "=0.9.0"
ironrdp-tokio = "=0.12.0"
x509-cert = { version = "0.3", default-features = false }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# Argon2 in an unoptimised dev build is about 30 times slower; keep the vault usable in `pnpm tauri dev`.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# The mRemoteNG import derives one PBKDF2-HMAC-SHA1 key per stored password. The hash loop is
# generic code that is compiled into the crate that uses it, so `fernjo-import` itself is optimised
# (a million iterations take about 0.3 s instead of minutes in an unoptimised dev build); `sha1`
# holds the compression function. Without this the tests of the work budget and the import dialog
# in `pnpm tauri dev` would hang on files with a few hundred passwords.
[profile.dev.package.fernjo-import]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3

# Decoding the RDP stream (bitmap and RemoteFX tiles, colour conversion, the TLS records) is a hot
# loop; unoptimised, as in `pnpm tauri dev`, it cannot keep up with scrolling or dragging a window
# (the render spike was measured with release builds). `ironrdp-*` and `rustls` are generic code that
# compiles into the crates that use it, so `fernjo-rdp` is optimised as well.
[profile.dev.package.ironrdp-async]
opt-level = 3
[profile.dev.package.ironrdp-bulk]
opt-level = 3
[profile.dev.package.ironrdp-cliprdr]
opt-level = 3
[profile.dev.package.ironrdp-connector]
opt-level = 3
[profile.dev.package.ironrdp-core]
opt-level = 3
[profile.dev.package.ironrdp-displaycontrol]
opt-level = 3
[profile.dev.package.ironrdp-dvc]
opt-level = 3
[profile.dev.package.ironrdp-egfx]
opt-level = 3
[profile.dev.package.ironrdp-error]
opt-level = 3
[profile.dev.package.ironrdp-graphics]
opt-level = 3
[profile.dev.package.ironrdp-input]
opt-level = 3
[profile.dev.package.ironrdp-pdu]
opt-level = 3
[profile.dev.package.ironrdp-rdpei]
opt-level = 3
[profile.dev.package.ironrdp-session]
opt-level = 3
[profile.dev.package.ironrdp-svc]
opt-level = 3
[profile.dev.package.ironrdp-tokio]
opt-level = 3
[profile.dev.package.fernjo-rdp]
opt-level = 3
[profile.dev.package.rustls]
opt-level = 3
