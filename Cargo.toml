[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/benjo-code/fernjo"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
directories = "6"
tempfile = "3"
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
secrecy = "0.10.3"
zeroize = "1.9.1"
unicode-normalization = "0.1.26"
getrandom = "0.4.3"

# Argon2 in an unoptimised dev build is about 30 times slower; keep the vault usable in `pnpm tauri dev`.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
