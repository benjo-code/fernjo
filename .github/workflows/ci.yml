name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Installs the channel and components pinned in rust-toolchain.toml (rustup 1.28+ does not do it implicitly).
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The self dev-dependency of fernjo-app turns on update-test-hooks for every --all-targets run, so
      # the line above never compiles the shipped configuration (feature off); this one does.
      - run: cargo clippy -p fernjo-app --lib --bins -- -D warnings
      # Throwaway OpenSSH container for the fernjo-ssh integration tests. The script prints
      # `export NAME=value` lines; they become environment variables of the later steps.
      - name: Start the SSH test server
        run: |
          set -o pipefail
          tools/ssh-test-server.sh start | sed 's/^export //' >> "$GITHUB_ENV"

      - run: cargo test --workspace

      - name: Stop the SSH test server
        if: always()
        run: tools/ssh-test-server.sh stop

  # The same tests on Windows, where the shipped Windows code paths compile. There is no OpenSSH
  # container here: the tests against it stay in job `rust`, and FERNJO_TEST_NO_SSH_SERVER lets
  # them skip. The test support honours that flag on Windows only.
  rust-windows:
    name: rust (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      FERNJO_TEST_NO_SSH_SERVER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the channel and components pinned in rust-toolchain.toml (rustup 1.28+ does not do it implicitly).
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # --no-fail-fast: one run names every failing test binary, not only the first.
      - run: cargo test --workspace --no-fail-fast
      # ONE-OFF, reverted by the next commit: the update check against real GitHub, on Windows.
      - run: cargo test -p fernjo-app --test updater_feed -- --ignored

  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  tauri-build:
    name: tauri-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # beforeBuildCommand in tauri.conf.json builds the UI; --no-bundle skips installers.
      - run: pnpm tauri build --debug --no-bundle

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

  # Policy check for the workflow files themselves (actions pinned to commit SHAs, the word
  # self-hosted absent, no pull_request_target, a top-level permissions: block present, no
  # untrusted values in run: scripts) and the tests of the release helper scripts. It does not
  # judge what the permissions grant or which runner labels are used.
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: bash tools/check-workflows.sh
      - run: bash tools/test-release-scripts.sh
