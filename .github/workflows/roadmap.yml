name: Roadmap

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# Stale runs of the same ref are cancelled.
concurrency:
  group: roadmap-${{ github.ref }}
  cancel-in-progress: true

# No artifacts and no cache: the job only reads the repository and writes nothing the runner has to keep.
jobs:
  roadmap:
    name: roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # The fixtures belong to the template; a repository created from it may leave them out.
      - name: Self-test of the generator
        if: ${{ hashFiles('tools/roadmap-fixtures/**') != '' }}
        run: dotnet run tools/roadmap.cs -- selftest

      - name: Check the roadmap
        run: dotnet run tools/roadmap.cs -- check
