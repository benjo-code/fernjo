name: Release

# Releases are immutable (repository setting, on since 2026-11-25): a published release takes no
# new files and its tag cannot move. So a release is built from a
# draft: push the tag `vX.Y.Z`, create a draft release for it
# (`gh release create vX.Y.Z --draft --verify-tag ...`), and the tag push runs this workflow, which
# builds the installers on GitHub-hosted runners, attaches them, SHA256SUMS and their build
# provenance to the draft and then publishes it. A failed run is repeated with "Re-run failed jobs"
# (reuses the built artifacts for 7 days) or, after that, `workflow_dispatch` run on the tag
# (`gh workflow run release.yml --ref vX.Y.Z`, builds again) while the release is still a draft;
# run on a branch it only builds. A pull request that touches the packaging inputs runs the
# same builds as a dry run: artifacts only, nothing is published.
# The hub image (ghcr.io/benjo-code/fernjo-hub) is built for amd64 and arm64 in the same runs: the
# dry run builds and smoke-tests it, only a tag push pushes it (job hub-image). Paths filter the
# whole workflow, so a pull request that touches only the hub image inputs also runs the
# installer builds.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml
      - Cargo.toml
      - tools/**
      - about.toml
      - src-tauri/resources/**
      - crates/fernjo-hub/Containerfile
      - crates/fernjo-hub/deploy/**
      - .dockerignore

# Untrusted values (the tag, release text, inputs) reach scripts only through env:. Jobs get
# read access by default; only the publish job below raises it.
permissions:
  contents: read

# The release tag: set when the run's ref is a `v*` tag (the tag push, or a manual run on the tag),
# empty on a pull request and on a manual run on a branch. The checkouts below use the full
# `refs/tags/<tag>`: a bare tag name lets actions/checkout prefer a branch of the same name (M11
# review #70).
env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            target: ''
            # Space-separated globs; every one must match at least one file.
            installers: target/release/bundle/nsis/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            bundles: dmg,app
            target: aarch64-apple-darwin
            installers: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg target/aarch64-apple-darwin/release/bundle/*.app.tar.gz
          - name: macos-x64
            os: macos-latest
            bundles: dmg,app
            target: x86_64-apple-darwin
            installers: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg target/x86_64-apple-darwin/release/bundle/*.app.tar.gz
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,deb
            target: ''
            installers: target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb
    steps:
      # Empty on a pull request, which then builds the merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || '' }}
          persist-credentials: false

      - name: Check that the tag matches the app version
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: bash tools/check-release-version.sh "$TAG"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Installs the channel and components pinned in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          if [ -n "$TARGET" ]; then rustup target add "$TARGET"; fi
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}

      # Pinned and --locked: a release must not pick up a newer, unreviewed tool. Cached by rust-cache.
      - name: Install cargo-about
        shell: bash
        run: cargo install --locked cargo-about@0.9.3 --features cli

      # Overwrites the committed placeholder; the file is bundled as a resource (see tauri.conf.json).
      # Fails when a bundled package has no licence text or a crate has a licence outside deny.toml.
      - name: Generate the third-party notices
        shell: bash
        run: node tools/third-party-notices.mjs src-tauri/resources/THIRD-PARTY-NOTICES.md

      # beforeBuildCommand in tauri.conf.json builds the UI.
      - name: Build the installers
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
        run: |
          # Keep build paths out of panic messages and debug info. rustc matches the native
          # path form, so Windows needs C:\Users\... (cygpath -w), not /c/Users/....
          workspace="$GITHUB_WORKSPACE"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if command -v cygpath >/dev/null 2>&1; then
            workspace="$(cygpath -w "$workspace")"
            cargo_home="$(cygpath -w "$cargo_home")"
          fi
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$workspace=/build --remap-path-prefix=$cargo_home=/cargo"
          if [ -n "$TARGET" ]; then
            pnpm tauri build --bundles "$BUNDLES" --target "$TARGET"
          else
            pnpm tauri build --bundles "$BUNDLES"
          fi

      # The remap above only helps if it took effect: fail when the app binary still names a
      # runner path. Tested on synthetic files in tools/test-release-scripts.sh.
      - name: Check the binary for build paths
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          dir=target/release
          if [ -n "$TARGET" ]; then dir="target/$TARGET/release"; fi
          bin="$dir/fernjo"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          bash tools/check-no-build-paths.sh "$bin"

      # The updater installs a macOS update from a gzip tarball whose one top-level entry is
      # fernjo.app/ (no ./ prefix, no extra entries; found by the M13 spike). COPYFILE_DISABLE keeps
      # bsdtar from adding ._ metadata entries, and the listing is checked. The version is the app
      # version (on a release the tag check above has proven it equals the tag).
      - name: Pack the app bundle for the updater (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          COPYFILE_DISABLE: '1'
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$TARGET" in
            aarch64-apple-darwin) arch=aarch64 ;;
            x86_64-apple-darwin) arch=x64 ;;
            *) echo "::error::unexpected macOS target $TARGET"; exit 1 ;;
          esac
          dir="target/$TARGET/release/bundle"
          out="$dir/fernjo_${version}_${arch}.app.tar.gz"
          tar -C "$dir/macos" -czf "$out" fernjo.app
          tar -tzf "$out" | awk -F/ '$1 != "fernjo.app" { bad = 1; print "unexpected entry: " $0 } END { exit bad }'
          ls -l "$out"

      # Fails loudly when a glob matches nothing, listing what the bundler actually produced,
      # so a naming surprise shows up in the first run instead of as an empty release.
      - name: Collect the installers
        shell: bash
        env:
          PATTERNS: ${{ matrix.installers }}
        run: |
          shopt -s nullglob
          mkdir installers
          read -ra patterns <<< "$PATTERNS"
          missing=0
          for pattern in "${patterns[@]}"; do
            matches=( $pattern )
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "::error::no installer matches $pattern"
              missing=1
              continue
            fi
            for file in "${matches[@]}"; do
              echo "installer: $file"
              cp "$file" installers/
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "Files under target/ that look like bundle output:"
            find target -path '*/bundle/*' -type f | sort
            exit 1
          fi

      # Installs or mounts the installer just built and proves it is usable (see the scripts).
      - name: Smoke-test the installer (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          arch=""
          case "$TARGET" in
            aarch64-apple-darwin) arch=arm64 ;;
            x86_64-apple-darwin) arch=x86_64 ;;
          esac
          bash tools/smoke-installed.sh installers "$arch"

      - name: Smoke-test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/smoke-installed.ps1 -Installers installers

      # A pull request from a fork still builds (the dry run), but its installers are not offered for
      # download from this repository's run page (M11 review #73).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: installers-${{ matrix.name }}
          path: installers/
          if-no-files-found: error
          retention-days: 7

  # The hub image (M12). The two build jobs run the same steps natively (no emulation) and only
  # read the repository; the image they test is the image `hub-image` pushes, as an OCI archive
  # that travels between the jobs. On a pull request the build jobs are the dry run: image built
  # and smoke-tested, nothing pushed. The jobs use Podman (preinstalled on the runners), the
  # owner's own tool; if the smoke test cannot run rootless there, switch every `podman` of the
  # three steps to `sudo podman` rather than weaken the test.
  hub-image-build:
    name: hub image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      # Empty on a pull request, which then builds the merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || '' }}
          persist-credentials: false

      # Also checks the image tag pinned in the Compose file and the Quadlet unit.
      - name: Check that the tag matches the app version
        if: env.RELEASE_TAG != ''
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: bash tools/check-release-version.sh "$TAG"

      - name: Build the image
        run: |
          version=dev
          if [ -n "$RELEASE_TAG" ]; then version="${RELEASE_TAG#v}"; fi
          podman build --build-arg VERSION="$version" --build-arg REVISION="$GITHUB_SHA" -f crates/fernjo-hub/Containerfile -t localhost/fernjo-hub:test .

      # init, serve, /v1/info, stop: a failing smoke test stops the run before anything is pushed.
      - name: Smoke-test the image
        env:
          ENGINE: podman
        run: bash tools/smoke-hub-image.sh localhost/fernjo-hub:test

      - name: Save the image as an OCI archive
        env:
          ARCH: ${{ matrix.arch }}
        run: podman save --format oci-archive -o "hub-${ARCH}.oci.tar" localhost/fernjo-hub:test

      # A pull request from a fork still builds (the dry run), but its archive is not offered for
      # download from this repository's run page, like the installers.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: hub-image-${{ matrix.arch }}
          path: hub-${{ matrix.arch }}.oci.tar
          if-no-files-found: error
          retention-days: 7

  # The only job that may write packages. It pushes the archives the build jobs tested as one
  # manifest list under X.Y.Z, X.Y and latest (the image is public-readable only after the owner
  # changes the package's visibility once, see Docs/hub.md). A failed run is repeated with "Re-run
  # failed jobs": pushing the same list again gives the same digest on every tag.
  hub-image:
    name: hub image (push)
    needs: hub-image-build
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
          persist-credentials: false

      # One folder per artifact (no merge): hub-archives/hub-image-<arch>/hub-<arch>.oci.tar
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hub-image-*
          path: hub-archives

      # The auth file sits where Podman, skopeo and the attestation step all look for it. The
      # first push creates the package and links it to this repository (the `source` label).
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.docker"
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io --authfile "$HOME/.docker/config.json" -u "$GITHUB_ACTOR" --password-stdin

      - name: Push the manifest list
        env:
          TAG: ${{ env.RELEASE_TAG }}
          IMAGE: ghcr.io/benjo-code/fernjo-hub
        run: |
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          refs="$(bash tools/hub-image-tags.sh "$TAG" "$IMAGE")"
          list=localhost/fernjo-hub-list
          podman manifest create "$list"
          # GHCR links a new package to the repository through the source annotation of the index (the
          # labels sit in the per-architecture images). Podman before 5 has no `--index`; then the
          # owner connects the package by hand (Docs/hub.md, "Make the package public").
          if ! podman manifest annotate --index --annotation org.opencontainers.image.source=https://github.com/benjo-code/fernjo "$list"; then
            echo "::warning::could not annotate the index with its source; connect the package to the repository by hand"
          fi
          podman manifest add "$list" oci-archive:hub-archives/hub-image-amd64/hub-amd64.oci.tar
          podman manifest add "$list" oci-archive:hub-archives/hub-image-arm64/hub-arm64.oci.tar
          : > digests.txt
          while read -r ref; do
            podman manifest push --all --digestfile digest.tmp "$list" "docker://$ref" < /dev/null
            echo "$ref $(cat digest.tmp)" | tee -a digests.txt
          done <<< "$refs"

      - name: Check that every tag has the same digest
        id: digest
        run: |
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          if [ "$(wc -l < digests.txt)" -ne 3 ]; then
            echo "::error::expected three pushed tags"
            cat digests.txt
            exit 1
          fi
          digest="$(cut -d ' ' -f 2 digests.txt | sort -u)"
          if [ "$(printf '%s\n' "$digest" | wc -l)" -ne 1 ] || ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the tags do not share one digest"
            cat digests.txt
            exit 1
          fi
          # What Podman reported is not enough: ask the registry what each tag holds now.
          while read -r ref _; do
            actual="$(skopeo inspect --format '{{.Digest}}' "docker://$ref" < /dev/null)"
            if [ "$actual" != "$digest" ]; then
              echo "::error::$ref holds $actual in the registry, expected $digest"
              exit 1
            fi
          done < digests.txt
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify both architectures
        env:
          TAG: ${{ env.RELEASE_TAG }}
          IMAGE: ghcr.io/benjo-code/fernjo-hub
        run: |
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          ref="$(bash tools/hub-image-tags.sh "$TAG" "$IMAGE" | head -n 1)"
          manifest="$(skopeo inspect --raw "docker://$ref")"
          for arch in amd64 arm64; do
            if ! printf '%s\n' "$manifest" | grep -Eq "\"architecture\": ?\"$arch\""; then
              echo "::error::$ref has no $arch image"
              printf '%s\n' "$manifest"
              exit 1
            fi
          done
          echo "$ref holds amd64 and arm64"

      # Build provenance for the image: ties the digest to this workflow and the tag. Check it with
      # `gh attestation verify oci://ghcr.io/benjo-code/fernjo-hub:<version> --repo benjo-code/fernjo
      # --signer-workflow benjo-code/fernjo/.github/workflows/release.yml --source-ref refs/tags/v<version>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/benjo-code/fernjo-hub
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # Signs the four update files (the NSIS installer, both macOS tarballs, the AppImage) with the
  # owner's update key, which exists only as the two secrets of the `release-signing` environment
  # (restricted to `v*` tags). This is the only job that names them, and only in the `env:` of the one
  # signing step; the steps before it run without the secrets. Dependencies install with
  # --ignore-scripts so no package script runs in a job that later holds the key: the Tauri CLI is a
  # native binary shipped in an optional platform package, which needs no install script. Nothing here
  # writes to the repository or to a release (contents: read only); `publish` attaches the signatures
  # after `verify-signatures` has checked them. The signature is bound to the release version
  # (--app-version), because the app's updater runs with requireSignedVersion.
  # Not proven by any test: the first signed run is the v0.4.0 release. The dry run of a pull
  # request skips this job; a wrong key or password shows up first in that release's run.
  sign:
    name: sign update files
    needs: build
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
          persist-credentials: false

      # Same layout and checks as `publish`: one folder per artifact, nothing extra or foreign.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: artifacts

      - name: Verify the installer set
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: bash tools/verify-installers.sh "${TAG#v}" --artifacts artifacts installers

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency cache here: a restored cache is input to a job that holds the signing key.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The Tauri CLI reads the key and its password from these two variables. The signature lands
      # next to each file as <file>.sig.
      - name: Sign the update files
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${TAG#v}"
          for file in "fernjo_${version}_x64-setup.exe" "fernjo_${version}_aarch64.app.tar.gz" "fernjo_${version}_x64.app.tar.gz" "fernjo_${version}_amd64.AppImage"; do
            pnpm tauri signer sign --app-version "$version" "installers/$file"
            if ! [ -s "installers/$file.sig" ]; then
              echo "::error::no signature was written for $file"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-signatures
          path: installers/*.sig
          if-no-files-found: error
          retention-days: 7

  # Checks every signature against the public key pinned in tauri.conf.json, with the same
  # verification the app's updater runs (and the signed version), before `publish` may write
  # latest.json from them. No secret and no write access: a wrong key, a truncated file or a
  # signature for another file fails the run here.
  verify-signatures:
    name: verify update signatures
    needs: sign
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
          persist-credentials: false

      # Installs the channel and components pinned in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: artifacts

      - name: Verify the installer set
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: bash tools/verify-installers.sh "${TAG#v}" --artifacts artifacts installers

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-signatures
          path: signatures

      - name: Verify the signatures
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          version="${TAG#v}"
          if [ "$(find signatures -type f | wc -l)" -ne 4 ]; then
            echo "::error::expected exactly four signature files"
            find signatures -type f
            exit 1
          fi
          cargo build --locked -p fernjo-core --example verify_update_signature
          for file in "fernjo_${version}_x64-setup.exe" "fernjo_${version}_aarch64.app.tar.gz" "fernjo_${version}_x64.app.tar.gz" "fernjo_${version}_amd64.AppImage"; do
            cargo run --locked -p fernjo-core --example verify_update_signature -- src-tauri/tauri.conf.json "installers/$file" "signatures/$file.sig" --app-version "$version"
          done

  publish:
    name: publish
    # The release is immutable once published and its deploy files pin the hub image, so it is not
    # published while the image is missing: a failed push leaves a draft to repeat. It also waits for
    # the signature check, so latest.json is only written from signatures that verified.
    needs:
      - build
      - hub-image
      - verify-signatures
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
          persist-credentials: false

      # A published release is immutable and takes no new files, so the installers go onto a draft
      # that the last step publishes. Without a draft the run stops here; create it and use "Re-run
      # failed jobs" (see CLAUDE.md "Releases").
      - name: Check that the release is a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if ! draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            echo "::error::could not read a release for $TAG (see the gh error above): if there is none, create the draft (gh release create $TAG --draft --verify-tag), then re-run the failed jobs"
            exit 1
          fi
          if [ "$draft" != "true" ]; then
            echo "::error::the release $TAG is already published; a published release takes no new files"
            exit 1
          fi

      # One folder per artifact (not merged into one), so one build job cannot overwrite another
      # platform's installer. verify-installers.sh --artifacts refuses any other or extra artifact and
      # any file outside its own platform's folder, then collects the five into installers/
      # (M11 review #72).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: artifacts

      - name: Verify the installer set
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: bash tools/verify-installers.sh "${TAG#v}" --artifacts artifacts installers

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-signatures
          path: signatures

      # The signatures sit next to their files in the verified folder; latest.json is written from
      # them and from the CHANGELOG section of this version, checked, and the finished folder (seven
      # files, four signatures, latest.json, nothing else) is verified before anything is attached.
      - name: Add the signatures and write latest.json
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          cp signatures/*.sig installers/
          node tools/write-latest-json.mjs "${TAG#v}" installers CHANGELOG.md
          node tools/write-latest-json.mjs --check "${TAG#v}" installers
          bash tools/verify-installers.sh "${TAG#v}" --release installers

      - name: Write SHA256SUMS
        run: (cd installers && sha256sum -- *) > SHA256SUMS

      # Build provenance (M11 review #71): SHA256SUMS sits in the same release as the installers, so
      # it proves integrity, not origin. The attestation ties each installer to a run of this
      # workflow and its ref (the tag); check it with `gh attestation verify <file> --repo
      # benjo-code/fernjo --signer-workflow benjo-code/fernjo/.github/workflows/release.yml
      # --source-ref refs/tags/<tag>` (see the README; the tag pin holds because the `v*` tag
      # ruleset stops tags from moving).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installers/*

      # --clobber only replaces files of an earlier failed run on the same draft.
      - name: Attach the installers to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: gh release upload "$TAG" installers/* SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      # From here on the release, its files and its tag are immutable.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
