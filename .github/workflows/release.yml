name: Release

# A published release builds the installers on GitHub-hosted runners and attaches them, plus
# SHA256SUMS, to that release. `workflow_dispatch` with a `tag` re-attaches them to an existing
# release (it only exists once this file is on the default branch). A pull request that touches
# the packaging inputs runs the same builds as a dry run: artifacts only, nothing is published.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the installers to (for example v0.1.0)
        required: false
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml
      - Cargo.toml
      - tools/**
      - about.toml
      - src-tauri/resources/**

# Untrusted values (the tag, release text, inputs) reach scripts only through env:. Jobs get
# read access by default; only the publish job below raises it.
permissions:
  contents: read

# The release tag, empty on a pull request (and on a manual run without a tag). The checkouts below
# use the full `refs/tags/<tag>`: a bare tag name lets actions/checkout prefer a branch of the same
# name (M11 review #70).
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            target: ''
            # Space-separated globs; every one must match at least one file.
            installers: target/release/bundle/nsis/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            bundles: dmg
            target: aarch64-apple-darwin
            installers: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            os: macos-latest
            bundles: dmg
            target: x86_64-apple-darwin
            installers: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,deb
            target: ''
            installers: target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb
    steps:
      # Empty on a pull request, which then builds the merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || '' }}
          persist-credentials: false

      - name: Check that the tag matches the app version
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: bash tools/check-release-version.sh "$TAG"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Installs the channel and components pinned in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          if [ -n "$TARGET" ]; then rustup target add "$TARGET"; fi
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}

      # Pinned and --locked: a release must not pick up a newer, unreviewed tool. Cached by rust-cache.
      - name: Install cargo-about
        shell: bash
        run: cargo install --locked cargo-about@0.9.3 --features cli

      # Overwrites the committed placeholder; the file is bundled as a resource (see tauri.conf.json).
      # Fails when a bundled package has no licence text or a crate has a licence outside deny.toml.
      - name: Generate the third-party notices
        shell: bash
        run: node tools/third-party-notices.mjs src-tauri/resources/THIRD-PARTY-NOTICES.md

      # beforeBuildCommand in tauri.conf.json builds the UI.
      - name: Build the installers
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
        run: |
          # Keep build paths out of panic messages and debug info. rustc matches the native
          # path form, so Windows needs C:\Users\... (cygpath -w), not /c/Users/....
          workspace="$GITHUB_WORKSPACE"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if command -v cygpath >/dev/null 2>&1; then
            workspace="$(cygpath -w "$workspace")"
            cargo_home="$(cygpath -w "$cargo_home")"
          fi
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$workspace=/build --remap-path-prefix=$cargo_home=/cargo"
          if [ -n "$TARGET" ]; then
            pnpm tauri build --bundles "$BUNDLES" --target "$TARGET"
          else
            pnpm tauri build --bundles "$BUNDLES"
          fi

      # The remap above only helps if it took effect: fail when the app binary still names a
      # runner path. Tested on synthetic files in tools/test-release-scripts.sh.
      - name: Check the binary for build paths
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          dir=target/release
          if [ -n "$TARGET" ]; then dir="target/$TARGET/release"; fi
          bin="$dir/fernjo"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          bash tools/check-no-build-paths.sh "$bin"

      # Fails loudly when a glob matches nothing, listing what the bundler actually produced,
      # so a naming surprise shows up in the first run instead of as an empty release.
      - name: Collect the installers
        shell: bash
        env:
          PATTERNS: ${{ matrix.installers }}
        run: |
          shopt -s nullglob
          mkdir installers
          read -ra patterns <<< "$PATTERNS"
          missing=0
          for pattern in "${patterns[@]}"; do
            matches=( $pattern )
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "::error::no installer matches $pattern"
              missing=1
              continue
            fi
            for file in "${matches[@]}"; do
              echo "installer: $file"
              cp "$file" installers/
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "Files under target/ that look like bundle output:"
            find target -path '*/bundle/*' -type f | sort
            exit 1
          fi

      # Installs or mounts the installer just built and proves it is usable (see the scripts).
      - name: Smoke-test the installer (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          arch=""
          case "$TARGET" in
            aarch64-apple-darwin) arch=arm64 ;;
            x86_64-apple-darwin) arch=x86_64 ;;
          esac
          bash tools/smoke-installed.sh installers "$arch"

      - name: Smoke-test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/smoke-installed.ps1 -Installers installers

      # A pull request from a fork still builds (the dry run), but its installers are not offered for
      # download from this repository's run page (M11 review #73).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: installers-${{ matrix.name }}
          path: installers/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
          persist-credentials: false

      # One folder per artifact (not merged into one), so one build job cannot overwrite another
      # platform's installer. verify-installers.sh --artifacts refuses any other or extra artifact and
      # any file outside its own platform's folder, then collects the five into installers/
      # (M11 review #72).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: artifacts

      - name: Verify the installer set
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: bash tools/verify-installers.sh "${TAG#v}" --artifacts artifacts installers

      - name: Write SHA256SUMS
        run: (cd installers && sha256sum -- *) > SHA256SUMS

      # Build provenance (M11 review #71): SHA256SUMS sits in the same mutable release as the
      # installers, so it proves integrity, not origin. The attestation ties each installer to a run
      # of this workflow and its ref (the tag for a release event); check it with `gh attestation
      # verify <file> --repo benjo-code/fernjo --signer-workflow
      # benjo-code/fernjo/.github/workflows/release.yml --source-ref refs/tags/<tag>` (see the
      # README; the tag pin holds while tags cannot be moved).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installers/*

      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" installers/* SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
