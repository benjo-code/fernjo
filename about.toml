# cargo-about configuration for tools/third-party-notices.mjs (the installers' licence notices).
# `accepted` mirrors the [licenses] allow-list of deny.toml (keep both in step); the fonts are npm
# packages with OFL-1.1 and are handled by the script.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]

# The OS families the installers cover: Windows, macOS (both architectures) and Linux.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

ignore-dev-dependencies = true
ignore-build-dependencies = false
