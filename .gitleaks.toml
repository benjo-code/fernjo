# gitleaks configuration (used by the release security review: docs/release-checklist.md, gap 9).
# Run from the repo root:
#   docker run --rm -v "<repo>:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact --no-banner
# It reads this file from the scanned repository. Expected result: "no leaks found". The allowlist paths
# match with or without a leading folder, so a `dir /repo` scan (absolute paths) is judged the same way.
#
# The allowlists below are deliberately narrow (exact files, one rule) so that a real secret in any
# other file, or any other rule firing in these files, still fails the scan.

title = "fernjo"

[extend]
useDefault = true

# mRemoteNG import fixtures: synthetic test data. The Password attributes are encrypted with mRemoteNG's
# publicly known default key or with test keys (generated by tools/mremoteng-vectors.cs); the owner file
# is the owner's sanitised export whose passwords are test values (see crates/fernjo-import/tests/owner.rs).
[[allowlists]]
description = "mRemoteNG import test fixtures (synthetic or sanitised, encrypted test passwords and key vectors)"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)crates/fernjo-import/tests/fixtures/custom-key\.xml$''',
  '''(^|/)crates/fernjo-import/tests/fixtures/default-key\.xml$''',
  '''(^|/)crates/fernjo-import/tests/fixtures/owner-confCons\.xml$''',
  '''(^|/)crates/fernjo-import/tests/fixtures/vectors\.json$''',
]

# localStorage key names of the UI (view state only, not secrets).
[[allowlists]]
description = "UI localStorage key names"
targetRules = ["generic-api-key"]
# Both the path and the line must match (gitleaks defaults to OR and to matching the regex against the
# secret only, which exempted every finding in these files): M11 review #74.
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)ui/src/lib/store\.svelte\.ts$''',
  '''(^|/)ui/src/lib/store\.test\.ts$''',
]
regexes = [
  '''(STORAGE_KEY|KEY) = "fernjo\.[A-Za-z0-9._-]+"''',
]

# RDP TLS test certificates: private keys generated for the tests only (see the folder's README.md).
[[allowlists]]
description = "RDP TLS test-only private keys"
targetRules = ["private-key"]
paths = [
  '''(^|/)crates/fernjo-rdp/tests/fixtures/[a-z0-9-]+\.key$''',
]

# Update signature test fixtures: public key texts of a throw-away test key pair (the private half was
# deleted; see the folder's README.md), not secrets.
[[allowlists]]
description = "Update signature test public keys"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)crates/fernjo-core/tests/fixtures/update-sig/other-key\.pub$''',
  '''(^|/)crates/fernjo-core/tests/fixtures/update-sig/other-conf\.json$''',
]
