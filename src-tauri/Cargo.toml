[package]
name = "fernjo-app"
description = "Tauri shell for fernjo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "fernjo_app_lib"

[[bin]]
name = "fernjo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
fernjo-core = { path = "../crates/fernjo-core" }
fernjo-vault = { path = "../crates/fernjo-vault" }
fernjo-ssh = { path = "../crates/fernjo-ssh" }
fernjo-rdp = { path = "../crates/fernjo-rdp" }
fernjo-import = { path = "../crates/fernjo-import" }
fernjo-sync = { path = "../crates/fernjo-sync" }
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid.workspace = true
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
tempfile.workspace = true
fernjo-hub = { path = "../crates/fernjo-hub" }
base64.workspace = true
